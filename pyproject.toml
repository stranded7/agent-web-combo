[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-web-combo"
version = "0.1.0"
description = "Search APIs + Kitesurf/Playwright + agent-reach combo"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "mcp>=1.0",
]

[tool.setuptools.packages.find]
include = ["combo*"]
